<!doctype html>
<html lang="pl" data-theme="dark" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0f1117" />
		<title>Słownik Języka Trudnego | Nauka rzadkich i pięknych słów</title>
		<meta name="description" content="Aplikacja do nauki rzadkich i wykwintnych polskich słów przy użyciu inteligentnego systemu powtórek." />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
		<script>
			(function() {
				try {
					var saved = localStorage.getItem('sjt_theme_mode');
					var theme = saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
					document.documentElement.setAttribute('data-theme', theme);
					if (theme === 'dark') {
						document.documentElement.classList.add('dark');
					} else {
						document.documentElement.classList.remove('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#faf7f2] dark:bg-[#0f1117] text-[#1e1b18] dark:text-[#e2e8f0] font-sans antialiased selection:bg-[#d97706]/30 selection:text-[#b45309] dark:selection:text-[#fef3c7] min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
