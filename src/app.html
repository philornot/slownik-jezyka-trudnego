<!doctype html>
<html lang="pl" data-theme="dark" class="dark">

<head>
	<meta charset="utf-8" />
	<link rel="icon" type="image/x-icon" href="%sveltekit.assets%/favicon.ico" />
	<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
	<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
	<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
	<meta name="theme-color" content="#091011" />
	<meta name="mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	<meta name="apple-mobile-web-app-title" content="Słownik Języka Trudnego" />
	<!-- Primary SEO Meta Tags -->
	<title>Słownik Języka Trudnego - Inteligentna nauka bogatego słownictwa</title>
	<meta name="description"
		content="Darmowa aplikacja do nauki wyrafinowanych i rzadkich polskich słów z wykorzystaniem inteligentnego algorytmu powtórek SuperMemo SM-2." />
	<link rel="canonical" href="https://www.slownik-jezyka-trudnego.pl/" />

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website" />
	<meta property="og:locale" content="pl_PL" />
	<meta property="og:site_name" content="Słownik Języka Trudnego" />
	<meta property="og:url" content="https://www.slownik-jezyka-trudnego.pl/" />
	<meta property="og:title" content="Słownik Języka Trudnego - Inteligentna nauka bogatego słownictwa" />
	<meta property="og:description"
		content="Darmowa aplikacja do nauki wyrafinowanych i rzadkich polskich słów z wykorzystaniem inteligentnego algorytmu powtórek SuperMemo SM-2." />
	<meta property="og:image" content="https://www.slownik-jezyka-trudnego.pl/logo-wide.png" />
	<meta property="og:image:alt" content="Słownik Języka Trudnego - Logo" />

	<!-- Twitter Cards -->
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Słownik Języka Trudnego - Inteligentna nauka bogatego słownictwa" />
	<meta name="twitter:description"
		content="Darmowa aplikacja do nauki wyrafinowanych i rzadkich polskich słów z wykorzystaniem inteligentnego algorytmu powtórek SuperMemo SM-2." />
	<meta name="twitter:image" content="https://www.slownik-jezyka-trudnego.pl/logo-wide.png" />
	<meta name="twitter:image:alt" content="Słownik Języka Trudnego - Logo" />

	<!-- Structured Data (Schema.org JSON-LD) -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@graph": [
			{
				"@type": "WebSite",
				"@id": "https://www.slownik-jezyka-trudnego.pl/#website",
				"url": "https://www.slownik-jezyka-trudnego.pl/",
				"name": "Słownik Języka Trudnego",
				"description": "Aplikacja do nauki wyrafinowanych i rzadkich polskich słów przy użyciu inteligentnego systemu powtórek.",
				"inLanguage": "pl-PL"
			},
			{
				"@type": "LearningResource",
				"@id": "https://www.slownik-jezyka-trudnego.pl/#learningresource",
				"url": "https://www.slownik-jezyka-trudnego.pl/",
				"name": "Słownik Języka Trudnego",
				"description": "Darmowe narzędzie edukacyjne do nauki rzadkich i trudnych polskich słów z wykorzystaniem inteligentnego algorytmu powtórek SuperMemo SM-2.",
				"learningResourceType": "Dictionary",
				"educationalUse": "Self-learning, Practice",
				"teaches": "Język polski, zaawansowane słownictwo, etymologia",
				"isAccessibleForFree": true,
				"inLanguage": "pl-PL"
			}
		]
	}
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap"
		rel="stylesheet">
	<script>
		(function () {
			try {
				var saved = localStorage.getItem('sjt_theme_mode');
				var theme = saved === 'light' || (!saved && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
				document.documentElement.setAttribute('data-theme', theme);
				if (theme === 'dark') {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
			} catch (e) { }
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover"
	class="bg-(--bg-app) text-(--text-primary) font-sans antialiased selection:bg-(--brand-primary)/30 selection:text-(--brand-primary) min-h-screen">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
